server:
  port: 8081
  servlet:
    context-path: /

spring:
  config:
    import:
      - "optional:file:../.env[.properties]"
      - "optional:file:.env[.properties]"
  application:
    name: agent-service
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 1
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  mongodb:
    uri: mongodb://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@${MONGODB_HOST}:${MONGODB_PORT}/${MONGODB_DATABASE}?authSource=${MONGODB_DATABASE}


# 票务服务内部调用地址
ticket-service:
  base-url: http://localhost:8080
  # 内部调用 Token（与 ticket-service 约定的静态 Token）
  internal-token: ${INTERNAL_TOKEN:miaoyu-internal-token-2026}

# 高德地图代理配置
amap:
  endpoint: https://www.weavefox.cn
  base-path: /api/v1/amap
  token: ${AMAP_TOKEN:wfat_app_da4740a3349ac22860cc6a3cd7394ae0d27778a8fb21c9adc6e9a6b320201922}

# DeepSeek LLM 配置
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com/v1
      api-key: ${DEEPSEEK_API_KEY}
      model-name: deepseek-chat
      temperature: 0.3
      max-tokens: 2048
      timeout: 90s
      log-requests: false
      log-responses: false
    streaming-chat-model:
      base-url: https://api.deepseek.com/v1
      api-key: ${DEEPSEEK_API_KEY}
      model-name: deepseek-chat
      temperature: 0.3
      max-tokens: 2048
      timeout: 60s
      log-requests: false
      log-responses: false

# Agent 对话配置
agent:
  # Redis 会话上下文 TTL（秒）- 24h
  context-ttl-seconds: 86400
  # SSE 连接超时（秒）
  sse-timeout-seconds: 90
  # 连续否定阈值（达此值后降级为结构化追问）
  negate-threshold: 2

logging:
  level:
    org.dherhf: DEBUG
    dev.langchain4j: DEBUG

# SpringDoc OpenAPI 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  default-flat-param-object: true
