server:
  port: 8081
  servlet:
    context-path: /

spring:
  config:
    import:
      - "optional:file:../.env[.properties]"
      - "optional:file:.env[.properties]"
  application:
    name: agent-service
  ai:
    # DeepSeek 提供 OpenAI 兼容接口：Spring AI 通过 spring-ai-starter-model-openai 接入，
    # 仅需把 base-url 指向 api.deepseek.com 并将 model 指定为 deepseek-chat。
    openai:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        options:
          model: deepseek-chat
          temperature: 0.3
          max-tokens: 2048
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 1
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  mongodb:
    host: ${MONGODB_HOST}
    port: ${MONGODB_PORT:27017}
    database: ${MONGODB_DATABASE}
    username: ${MONGODB_USERNAME}
    password: ${MONGODB_PASSWORD}
    authentication-database: ${MONGODB_DATABASE}


# 票务服务内部调用地址
ticket-service:
  base-url: http://localhost:8080
  # 内部调用 Token（与 ticket-service 约定的静态 Token）
  internal-token: ${INTERNAL_TOKEN:miaoyu-internal-token-2026}

# 高德地图代理配置
amap:
  endpoint: https://www.weavefox.cn
  base-path: /api/v1/amap
  token: ${AMAP_TOKEN:wfat_app_da4740a3349ac22860cc6a3cd7394ae0d27778a8fb21c9adc6e9a6b320201922}

# Agent 对话配置
agent:
  # Redis 会话上下文 TTL（秒）- 24h
  context-ttl-seconds: 86400
  # SSE 连接超时（秒）
  sse-timeout-seconds: 90
  # 连续否定阈值（达此值后降级为结构化追问）
  negate-threshold: 2

logging:
  level:
    org.dherhf: DEBUG
    org.springframework.ai: DEBUG
