server:
  port: 8080

spring:
  config:
    import:
      - "optional:file:../.env[.properties]"
      - "optional:file:.env[.properties]"
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: assign_id

# JWT 配置
jwt:
  # 当前密钥
  current-secret: ${JWT_CURRENT_SECRET}
  # 旧密钥
  old-secret: ${JWT_OLD_SECRET:}
  # 签发者
  issuer: miaoyu
  # 用户 Token 有效期:24 小时
  user-expiration: 86400
  # 管理员 Token 有效期:8 小时
  admin-expiration: 28800

# 密码学配置
crypto:
  # AES-256 Base64 密钥（32 字节）
  aes-base64-key: ${CRYPTO_AES_KEY}

# 登录防爆破配置
login:
  # 最大失败次数
  max-fail-count: 5
  # 锁定时长:15 分钟
  lock-duration: 900

# 图形验证码配置
captcha:
  # 验证码过期时间（秒）
  expire-seconds: 60
  # 验证码字符数
  length: 4

# 短信验证码配置（阿里云号码认证服务）
sms:
  access-key-id: ${SMS_ACCESS_KEY_ID}
  access-key-secret: ${SMS_ACCESS_KEY_SECRET}
  sign-name: ${SMS_SIGN_NAME:速通互联验证码}
  # 注册/登录模板 CODE
  template-code-register: ${SMS_TEMPLATE_CODE_REGISTER:100001}
  # 重置密码模板 CODE
  template-code-reset-password: ${SMS_TEMPLATE_CODE_RESET_PASSWORD:100003}
  endpoint: dypnsapi.aliyuncs.com
  region: cn-beijing
  # 发送间隔限制（秒）
  send-interval: 60

# 内部接口 Token（agent-service 调用 /internal/** 时需携带）
internal:
  token: ${INTERNAL_TOKEN:miaoyu-internal-token-2026}

# 阿里云 OSS 配置
oss:
  endpoint: ${OSS_ENDPOINT}
  bucket-name: ${OSS_BUCKET_NAME}
  access-key-id: ${OSS_ACCESS_KEY_ID}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET}

# SpringDoc OpenAPI 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  default-flat-param-object: true
